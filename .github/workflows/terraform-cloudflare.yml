name: Terraform Cloudflare

on:
  pull_request:
    branches: [release-infra]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"
  push:
    branches: [release-infra]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: terraform-cloudflare-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_domain_name: ${{ vars.CLOUDFLARE_DOMAIN_NAME }}
  TF_VAR_pages_project_name: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'uft' }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  validate-and-plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Initialize remote state
        working-directory: infra/cloudflare
        run: >-
          terraform init
          -backend-config="organization=${{ vars.TF_CLOUD_ORGANIZATION }}"
          -backend-config="workspaces.name=${{ vars.TF_CLOUD_WORKSPACE }}"

      - name: Check formatting
        working-directory: infra/cloudflare
        run: terraform fmt -check -recursive

      - name: Validate configuration
        working-directory: infra/cloudflare
        run: terraform validate -no-color

      - name: Create plan
        working-directory: infra/cloudflare
        run: terraform plan -no-color

  apply:
    name: Apply
    needs: validate-and-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-infra'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Initialize remote state
        working-directory: infra/cloudflare
        run: >-
          terraform init
          -backend-config="organization=${{ vars.TF_CLOUD_ORGANIZATION }}"
          -backend-config="workspaces.name=${{ vars.TF_CLOUD_WORKSPACE }}"

      - name: Apply reviewed configuration
        working-directory: infra/cloudflare
        run: terraform apply -auto-approve -no-color
