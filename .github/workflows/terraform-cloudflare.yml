name: Terraform Cloudflare

on:
  pull_request:
    branches: [release-infra]
    paths:
      - "infra/modules/cloudflare-pages-site/**"
      - "infra/environments/production/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"
  push:
    branches: [release-infra]
    paths:
      - "infra/modules/cloudflare-pages-site/**"
      - "infra/environments/production/cloudflare/**"
      - ".github/workflows/terraform-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: terraform-cloudflare-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  validate-and-plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Initialize R2 state backend
        working-directory: infra/environments/production/cloudflare
        run: terraform init

      - name: Check formatting
        working-directory: infra/environments/production/cloudflare
        run: terraform fmt -check -recursive

      - name: Validate configuration
        working-directory: infra/environments/production/cloudflare
        run: terraform validate -no-color

      - name: Create plan
        working-directory: infra/environments/production/cloudflare
        run: terraform plan -no-color

  apply:
    name: Apply
    needs: validate-and-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-infra'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Initialize R2 state backend
        working-directory: infra/environments/production/cloudflare
        run: terraform init

      - name: Apply reviewed configuration
        working-directory: infra/environments/production/cloudflare
        run: terraform apply -auto-approve -no-color
