# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 設定項目: https://docs.coderabbit.ai/reference/configuration
language: ja-JP
tone_instructions: >-
  レビュー、要約、会話は日本語で、平易な言葉を使って簡潔に書いてください。
  指摘は「問題・起こる影響・具体的な修正案」の順に、原則3文以内で説明してください。
  専門用語には必要な場合だけ短い説明を添え、コード識別子は原文を保ってください。
  根拠のない断定、重複した指摘、長い前置き、好みだけの変更提案は避けてください。
  影響を受ける操作と再現条件、または根拠となるコードを示してください。
early_access: false

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    変更の目的と主な動作の変化を、日本語で最大3項目の短い箇条書きにしてください。
    実施が確認できないテストや効果を、実施済み・達成済みとして書かないでください。
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    # デフォルトブランチ（main）以外は自動レビュー対象に追加しない。
    base_branches: []

  # ソース、テスト、保存形式の migration、CI、Terraform、運用ドキュメントは対象に残す。
  # node_modules、dist、lockfile などは CodeRabbit 標準の除外に任せる。
  path_filters:
    - "!**/coverage/**"
    - "!**/playwright-report/**"
    - "!**/test-results/**"
    - "!artifacts/**"

  path_instructions:
    - path: "src/**/*.svelte"
      instructions: >-
        Svelte 5 の状態更新とコンポーネントの破棄を確認してください。
        キーボードとタッチで主要操作が完結するか、フォーカスや入力途中の値が失われないかを確認してください。
    - path: "src/lib/markdown/**"
      instructions: >-
        ソースとプレビューの往復で、操作対象外の Markdown と既存文書の内容が保たれるか確認してください。
        変換やサニタイズの変更では、コードフェンス、埋め込みデータ、外部入力の扱いを確認してください。
    - path: "src/lib/{domain,storage,transfer,workspace}/**"
      instructions: >-
        旧形式の読み込み、複数タブの同時編集、保存の途中失敗と再試行でデータが失われないか確認してください。
        ZIP 取り込みではパスとサイズの検証を、保存処理ではローカルファーストの境界を確認してください。
    - path: "e2e/**"
      instructions: >-
        実装の内部状態より、通常の入口から観測できる動作と、該当する失敗条件を検証しているか確認してください。
        保存や互換性の変更では、再読み込みや旧形式のデータを使った検証を優先してください。
    - path: ".github/workflows/**"
      instructions: >-
        ジョブの権限、トークンの残存範囲、PR 由来の入力がシェルに渡る経路を確認してください。
        書き込み認証情報が検証処理やフックに渡らないか、外部 Action がコミット SHA で固定されているか確認してください。

  # 一律のコメント量ではなく、既存のプロジェクト方針とコードの正しさを評価する。
  pre_merge_checks:
    docstrings:
      mode: "off"

  tools:
    oxc:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/adr/*.md"
        applyTo: "**/*"
      - files: "README.md"
        applyTo: "**/*"
